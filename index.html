<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Елизавета Цветкова — варианты сайта</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0c0b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23131110'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23c9ad94' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23c9ad94' text-anchor='middle'%3EЕЦ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0c0b;
      --bar: #161311;
      --line: rgba(236, 224, 212, .12);
      --text: #efe7df;
      --muted: #9d9289;
      --accent: #c9ad94;
      --bar-h: 64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; font-size: 14px;
      display: flex; flex-direction: column; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

    /* ---- control bar ---- */
    .bar {
      flex: none; height: var(--bar-h);
      display: flex; align-items: center; gap: 20px;
      padding: 0 18px;
      background: var(--bar); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; flex: none; }
    .mono {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--accent);
      display: grid; place-items: center;
      font-family: "Cormorant Garamond", Georgia, serif; font-size: 15px; color: var(--accent);
    }
    .brand p { line-height: 1.15; }
    .brand b { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .brand span { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 15px; color: var(--muted); }

    .seg {
      display: flex; gap: 4px; padding: 4px;
      border: 1px solid var(--line); border-radius: 999px;
    }
    .seg button {
      height: 36px; padding: 0 16px; border-radius: 999px;
      font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #131110; }
    .seg button i { font-style: normal; font-size: 11px; opacity: .7; margin-right: 6px; }

    .versions { margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
    .versions::-webkit-scrollbar { display: none; }
    .devices button { padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; }
    .devices svg { width: 16px; height: 16px; }
    .open {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px;
      font-size: 13px; font-weight: 500; color: var(--muted);
    }
    .open:hover { color: var(--text); border-color: rgba(236, 224, 212, .35); }

    /* ---- stage ---- */
    .stage {
      flex: 1; min-height: 0;
      display: flex; justify-content: center; align-items: stretch;
      background: var(--bg);
    }
    .frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    .stage.is-phone { align-items: center; padding: 18px 0; overflow: auto; }
    .stage.is-phone .device {
      width: 390px; height: min(844px, 100%); flex: none;
      border: 10px solid #2a2522; border-radius: 44px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    }
    .device { width: 100%; height: 100%; }
    .note {
      position: fixed; left: 18px; bottom: 16px;
      font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 17px; color: var(--muted);
      pointer-events: none;
    }
    .stage:not(.is-phone) ~ .note { display: none; }

    /* ---- narrow screens: phone users always see the real phone layout ---- */
    @media (max-width: 1100px) {
      .brand p, .open span { display: none; }
    }
    @media (max-width: 860px) {
      :root { --bar-h: auto; }
      .bar { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
      .brand { order: 1; }
      .open { order: 2; margin-left: auto; height: 38px; padding: 0 12px; }
      .versions { order: 3; flex: 1 1 100%; margin: 0; }
      .devices, .note { display: none !important; }
      .seg button { height: 34px; padding: 0 13px; font-size: 12.5px; }
    }
  </style>
</head>
<body>

  <header class="bar">
    <div class="brand">
      <span class="mono">ЕЦ</span>
      <p><b>Елизавета Цветкова</b><span>варианты сайта</span></p>
    </div>

    <nav class="seg versions" aria-label="Вариант дизайна">
      <button type="button" data-v="c" title="Тёмная, арка с портретом, вкладки по направлениям"><i>01</i>Тёмная · арка</button>
      <button type="button" data-v="a-dark" title="Тёмная, сетка карточек с мазками краски"><i>02</i>Тёмная · сетка</button>
      <button type="button" data-v="b" title="Чёрный и золото, крупная типографика"><i>03</i>Чёрное золото</button>
    </nav>

    <div class="seg devices" role="group" aria-label="Устройство">
      <button type="button" data-d="desktop" aria-label="Компьютер"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 20h7M12 16.5V20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Компьютер</button>
      <button type="button" data-d="phone" aria-label="Телефон"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 18.5h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Телефон</button>
    </div>

    <a class="open" href="version-c/" target="_blank" rel="noopener">↗ <span>Открыть отдельно</span></a>
  </header>

  <main class="stage">
    <div class="device">
      <iframe class="frame" title="Вариант сайта"></iframe>
    </div>
  </main>
  <p class="note">Пролистайте сайт внутри телефона</p>

  <script>
    // Versions live in their own folders; this page only switches between them.
    // State is kept in the URL (#c, #b/phone …) so a link opens the same view.
    const VERSIONS = ['c', 'a-dark', 'b'];
    const frame = document.querySelector('.frame');
    const stage = document.querySelector('.stage');
    const open = document.querySelector('.open');
    const vBtns = [...document.querySelectorAll('[data-v]')];
    const dBtns = [...document.querySelectorAll('[data-d]')];
    const narrow = matchMedia('(max-width: 860px)');

    let state = { v: 'c', d: 'desktop' };

    function readHash() {
      const [v, d] = location.hash.slice(1).split('/');
      return {
        v: VERSIONS.includes(v) ? v : 'c',
        d: d === 'phone' ? 'phone' : 'desktop',
      };
    }

    function apply(next, { push = true } = {}) {
      const changedVersion = next.v !== state.v || !frame.dataset.loaded;
      state = next;
      const src = `version-${state.v}/`;
      if (changedVersion) { frame.src = src; frame.dataset.loaded = '1'; }
      open.href = src;
      vBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === state.v));
      dBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.d === state.d));
      stage.classList.toggle('is-phone', state.d === 'phone' && !narrow.matches);
      const hash = `#${state.v}${state.d === 'phone' ? '/phone' : ''}`;
      if (push && location.hash !== hash) history.replaceState(null, '', hash);
      const label = vBtns.find((b) => b.dataset.v === state.v).textContent.replace(/^\d+/, '');
      frame.title = `Вариант сайта: ${label}`;
    }

    vBtns.forEach((b) => b.addEventListener('click', () => apply({ ...state, v: b.dataset.v })));
    dBtns.forEach((b) => b.addEventListener('click', () => apply({ ...state, d: b.dataset.d })));
    window.addEventListener('hashchange', () => apply(readHash(), { push: false }));
    narrow.addEventListener('change', () => apply(state, { push: false }));

    // keys 1–3 switch versions, P / D switch device
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const i = Number(e.key) - 1;
      if (VERSIONS[i]) apply({ ...state, v: VERSIONS[i] });
      if (e.key === 'p' || e.key === 'з') apply({ ...state, d: 'phone' });
      if (e.key === 'd' || e.key === 'в') apply({ ...state, d: 'desktop' });
    });

    apply(readHash(), { push: false });
  </script>
</body>
</html>
